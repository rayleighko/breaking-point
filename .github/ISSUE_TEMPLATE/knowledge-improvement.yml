name: Knowledge or documentation improvement
description: Wiki, 용어, 출처, 번역과 기여 문서를 개선합니다.
title: '[Knowledge] '
labels: [documentation]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Incorrect or ambiguous explanation
        - Missing source
        - Unnatural Korean terminology
        - Missing relation or keyword
        - Contribution or project documentation
    validations: { required: true }
  - type: input
    id: location
    attributes:
      label: Page or file
      description: 공개 URL, Topic slug 또는 repository path를 적어 주세요.
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: What should improve?
      description: 현재 설명이 어떤 오해를 만들거나 어떤 탐색을 막는지 적어 주세요.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: 완성된 문장이 아니어도 됩니다. 바꾸려는 의미와 적용 범위를 적어 주세요.
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: 기존 Breaking Point 자료를 먼저 확인하고, 부족하면 표준·원 논문·공식 문서를 적어 주세요. 개인 의견은 관점으로 표시해 주세요.
  - type: checkboxes
    id: originality
    attributes:
      label: Originality
      options:
        - label: 외부 유료 자료나 문제·해설·도표를 복제 또는 번역하지 않았습니다.
          required: true
