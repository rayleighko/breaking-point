name: Engineering Review Policy
description: Reusable TypeScript, Go, and Python PR review policy powered by OpenCodeReview
author: rayleighko

branding:
  icon: shield
  color: blue

inputs:
  llm_url:
    description: OpenAI-compatible or Anthropic API endpoint
    required: true
  llm_auth_token:
    description: Dedicated LLM API token
    required: true
  llm_model:
    description: Model identifier accepted by the configured endpoint
    required: true
  llm_use_anthropic:
    description: Set to true for Anthropic Messages API and false for OpenAI-compatible APIs
    required: true
  profiles:
    description: Comma-separated review profiles (typescript, go, python)
    required: false
    default: typescript,go,python
  project_rule:
    description: Optional repository-relative OpenCodeReview rule JSON merged before language policies
    required: false
    default: ''
  language:
    description: Review output language
    required: false
    default: English
  background:
    description: Product context and PR acceptance criteria passed to OpenCodeReview
    required: false
    default: ''
  github_token:
    description: GitHub token used to post PR comments
    required: false
    default: ${{ github.token }}
  ocr_version:
    description: Pinned @alibaba-group/open-code-review npm version
    required: false
    default: 1.7.16
  review_concurrency:
    description: Maximum concurrent OpenCodeReview file workers
    required: false
    default: '4'
  llm_timeout:
    description: LLM request timeout in seconds
    required: false
    default: '600'
  upload_artifacts:
    description: Upload raw JSON result and stderr
    required: false
    default: 'true'
  sticky_summary:
    description: Update one summary comment instead of creating a new summary on each run
    required: false
    default: 'true'
  incremental:
    description: Skip new inline comments that overlap earlier bot review comments
    required: false
    default: 'true'
  route_severity_below:
    description: Route findings at or below this severity to the summary
    required: false
    default: low
  route_categories:
    description: Comma-separated categories routed to the summary
    required: false
    default: style,documentation
  base_ref:
    description: Optional base ref override for non-pull_request events
    required: false
    default: ''
  head_sha:
    description: Optional head SHA override for non-pull_request events
    required: false
    default: ''

outputs:
  comments_total:
    description: Total number of review comments generated by OpenCodeReview
    value: ${{ steps.review.outputs.comments_total }}
  comments_inline:
    description: Number of inline comments posted
    value: ${{ steps.review.outputs.comments_inline }}
  comments_routed:
    description: Number of findings routed to the summary
    value: ${{ steps.review.outputs.comments_routed }}
  summary_comment_url:
    description: URL of the sticky summary comment
    value: ${{ steps.review.outputs.summary_comment_url }}

runs:
  using: composite
  steps:
    - name: Check out trusted base policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Review configuration always comes from the base, even when the caller uses pull_request.
        ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || github.sha }}
        fetch-depth: 1

    - name: Build review policy
      id: policy
      shell: bash
      env:
        REVIEW_PROFILES: ${{ inputs.profiles }}
        REVIEW_PROJECT_RULE: ${{ inputs.project_rule }}
      run: node "$GITHUB_ACTION_PATH/scripts/build-rule.mjs"

    # OpenCodeReview v1.7.16. Full SHA is required because this action receives LLM credentials.
    - name: Review pull request
      id: review
      uses: alibaba/open-code-review@a0b49d5bec7a7ec38ec8b98c59775f56bf46b932
      with:
        llm_url: ${{ inputs.llm_url }}
        llm_auth_token: ${{ inputs.llm_auth_token }}
        llm_model: ${{ inputs.llm_model }}
        llm_use_anthropic: ${{ inputs.llm_use_anthropic }}
        llm_timeout: ${{ inputs.llm_timeout }}
        language: ${{ inputs.language }}
        github_token: ${{ inputs.github_token }}
        ocr_version: ${{ inputs.ocr_version }}
        review_concurrency: ${{ inputs.review_concurrency }}
        background: ${{ inputs.background }}
        rule: ${{ steps.policy.outputs.rule_path }}
        upload_artifacts: ${{ inputs.upload_artifacts }}
        sticky_summary: ${{ inputs.sticky_summary }}
        incremental: ${{ inputs.incremental }}
        route_severity_below: ${{ inputs.route_severity_below }}
        route_categories: ${{ inputs.route_categories }}
        base_ref: ${{ inputs.base_ref }}
        head_sha: ${{ inputs.head_sha }}
