name: Independent AI review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Prefer a verified full release SHA instead of v1 in security-sensitive repositories.
      - uses: rayleighko/engineering-review-action@v1
        with:
          llm_url: ${{ secrets.AI_REVIEW_LLM_URL }}
          llm_auth_token: ${{ secrets.AI_REVIEW_LLM_TOKEN }}
          llm_model: ${{ vars.AI_REVIEW_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.AI_REVIEW_USE_ANTHROPIC }}
          profiles: typescript,go,python
          project_rule: .engineering-review/rule.json
          language: Korean
          background: >-
            PR title: ${{ github.event.pull_request.title }}
            PR description and acceptance: ${{ github.event.pull_request.body }}
